name: Unauthorized Issuer Spoofing
summary: >-
  An unrecognized entity fabricates, replays, or reuses a stolen [=recognized
  entity credential=] to make its [=verifiable credentials=] appear to come
  from a legitimately recognized [=issuer=].
description: >-
  An entity that has not been granted a
  <code>RecognizedEntityCredential</code> by a legitimate [=E1|list
  publisher=] attempts to present itself as a recognized issuer. The attacker
  fabricates, replays, or reuses a stolen [=O1|recognized entity credential=]
  to make their [=O2|verifiable credentials=] appear to originate from a
  legitimately recognized entity. Without strict cryptographic verification of
  the full [=O1|recognized entity credential=] chain — from the issuer’s
  credential back to a trusted [=E1|list publisher=] — a [=E4|verifier=] may
  accept credentials from actors who were never actually recognized. This is
  particularly dangerous in high-stakes scenarios such as cross-border trade
  finance or product conformity assessment, where a fraudulent issuer could
  cause significant economic harm. A chain can also mislead even when nothing
  is forged. Every signature checks out. But an entity in the middle of the
  chain recognizes someone that its own recognizer does not explicitly
  or transitively recognize.
elements: [F4, F5, O2, O1]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Spoofing
response:
  - id: R1
    name: Cryptographic Verification of the Recognized Entity Credential Chain
    type: Reduce
    description: >-
      [=E4|Verifiers=] cryptographically verify that every [=O1|recognized
      entity credential=] in a presented chain carries a valid proof, that the
      <code>credentialSubject.id</code> of the [=O1|recognized entity
      credential=] matches the <code>issuer.id</code> of the credential under
      evaluation, and that the outermost [=O1|recognized entity credential=]
      was issued by an entity within the [=E4|verifier=]’s configured set of
      trust anchors. The specification requires conforming processors to
      produce errors when these checks fail, preventing unverified entities
      from appearing to be recognized. Checking signatures is not enough to
      catch a chain that misleads without forgery. A recognizer can attach
      rules, called credential validators, to each entity it recognizes.
      [=Recognition validation=] runs those rules on every credential in the
      chain, not just the first one. It starts next to the recognition anchor and
      works down the chain.
