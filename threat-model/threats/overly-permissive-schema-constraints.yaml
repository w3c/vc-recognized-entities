name: Overly Permissive Schema Constraints
summary: >-
  Broad, incomplete, or lax <code>outputValidation</code> schema rules let a
  recognized [=issuer=] produce a wider class of [=verifiable credentials=]
  than the list publisher intended to authorize.
description: >-
  A [=E1|list publisher=] who creates a [=O1|recognized entity credential=]
  may specify <code>outputValidation</code> schema rules that are too broad,
  incomplete, or lax, inadvertently permitting recognized [=E2|issuers=] to
  issue a wider class of [=O2|dependent verifiable credentials=] than was
  intended. An [=E2|issuer=] — acting legitimately within the stated schema
  constraints — could issue credential types that the [=E1|list publisher=]
  did not authorize, or the missing constraints could be exploited by a
  malicious [=E2|issuer=] to produce credentials that technically pass
  [=P6|Validate Credential(s)=] despite falling outside the intended
  recognition scope.
elements: [O1, E1, E2, E4, P1, P6]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Elevation of Privilege
response:
  - id: R14
    name: Precise and Complete Schema Validation Rules
    type: Reduce
    description: >-
      [=E1|List publishers=] define <code>outputValidation</code> schema rules
      that are as precise and restrictive as the intended recognition scope
      requires. Schemas enumerate permitted credential types explicitly rather
      than relying on broad or permissive patterns. Governance frameworks
      review and audit schema constraints as part of the [=P1|Create List=]
      and [=P7|Update List=] processes. [=E4|Verifiers=] treat credentials
      that fail schema validation as invalid and do not relax validation rules
      to accept credentials that would otherwise be rejected.
