name: Abuse of Recognized Actions
summary: >-
  A [=verifier=] interprets the free-form <code>action</code> value more
  permissively than the list publisher intended, granting a [=recognized
  entity=] broader capabilities than were authorized.
description: >-
  The <code>action</code> property in a [=O1|recognized entity credential=] is
  a free-form string (e.g., <code>issue</code>, <code>verify</code>). Without
  strict ecosystem-level governance of allowable action values, a
  [=E2|issuer=] may present credentials claiming broad or undefined actions
  that [=E4|verifiers=] interpret more permissively than the [=E1|list
  publisher=] intended during [=P6|Validate Credential(s)=]. This can grant
  recognized entities capabilities beyond what was authorized — for example,
  a credential authorizing <code>issue</code> for one credential type being
  interpreted as authorizing issuance of any credential type. Overly
  permissive interpretation could enable credential forgery, regulatory
  non-compliance, or fraud. Action values cause a second problem in a chain.
  Being allowed to do something is not the same as being allowed to let
  others do it (i.e., to delegate that permission/authority). An action value
  does not say which one it means. A [=E4|verifier=] that sees an entity
  as recognized to `issue` therefore accepts it when that entity recognizes another entity to `issue`.
elements: [O1, E1, E2, E4, P3, P6]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Elevation of Privilege
response:
  - id: R13
    name: Controlled Action Vocabulary and Strict Interpretation
    type: Reduce
    description: >-
      Ecosystem governance frameworks define and publish a controlled
      vocabulary of permitted <code>action</code> values and their precise
      semantics. [=E1|List publishers=] use only values from the governed
      vocabulary when issuing [=O1|recognized entity credentials=].
      [=E4|Verifiers=] accept only <code>action</code> values they explicitly
      recognize and have been configured to trust during [=P3|Configure
      Verifier=]. [=E4|Verifiers=] treat unknown, overly broad, or undefined
      action values as grounds for rejection during [=P6|Validate
      Credential(s)=] rather than falling back to permissive defaults. A
      governed vocabulary uses different names for values where performing
      an action and recognizing others for it are meant to be distinct
      powers. For example, a vocabulary might define `issue` for issuing
      credentials and `recognizeIssuers` for recognizing other entities to
      issue them, so a [=E1|list publisher=] that grants one does not grant the other.
