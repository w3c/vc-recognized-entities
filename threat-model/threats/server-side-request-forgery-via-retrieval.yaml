name: Server-Side Request Forgery via Retrieval
summary: >-
  A [=verifier=] fetches a [=URL=] taken from an unverified credential or
  identifier document, so an [=issuer=] can aim the [=verifier=]'s requests at
  hosts it cannot reach itself.
description: >-
  Discovery fetches [=URLs=] that come from documents nobody has checked yet.
  [=Credential-based discovery=] fetches the <code>recognizedIn</code> list
  named by a [=O2|verifiable credential=]. [=Identifier-based discovery=]
  resolves the [=E2|issuer=]'s identifier, then fetches the
  <code>serviceEndpoint</code> named by the document it just resolved. The
  [=E2|issuer=] controls that document, so the [=E2|issuer=] chooses where the
  [=E4|verifier=] sends its next request. Pointing it at an internal address
  makes the [=C4|verifier system=] reach hosts the [=E2|issuer=] cannot reach
  on its own, such as a cloud metadata service or an admin interface behind
  the firewall. The [=E4|verifier=] verifies proofs only after the response
  arrives. A failed proof check does not recall the request, and the attack
  does not need the response to be valid, or to come back at all. A redirect
  reaches the same destination from a [=URL=] that looked acceptable when the
  request was sent. This is distinct from External Resource Substitution,
  which is about the content that comes back; here the request itself is the
  attack.
elements: [O1, E2, E4, F5, P6, C4]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Elevation of Privilege
response:
  - id: R19
    name: Retrieval Policy for Discovery Fetches
    type: Reduce
    description: >-
      [=E4|Verifiers=] apply a retrieval policy to every fetch that discovery
      performs. The policy allows a named set of [=URL=] schemes and rejects
      the rest. It rejects destinations that are not publicly routable, such
      as loopback, link-local, and private-network addresses. Names are
      resolved before a request goes out, so the policy checks the address
      that the name resolved to, not the name alone. It checks each redirect
      target the same way, and limits how many redirects are followed. The
      [=E4|verifier=]'s HTTP client and identifier resolver enforce the
      policy, because they are the only parts that see the real destination
      and every hop. Deployments add egress restrictions at the network layer
      as a second line of defense. The residual risk is that a [=E4|verifier=]
      whose own network is flat, or whose policy permits a host that later
      becomes sensitive, is still exposed.
