name: Unbounded Recognition Chain Trust
summary: >-
  A compromised entry in a lower-level registry chained via
  <code>recognizedIn</code> is transitively trusted when a [=verifier=] does
  not enforce depth limits or independently validate each link in the chain.
description: >-
  The <code>recognizedIn</code> property allows [=O1|recognized entity
  credentials=] to chain to other registries — such as ETSI Trust Service
  Lists, X.509 certificate authority lists, or other [=O1|recognized entity
  credentials=]. A compromised or malicious entry in a lower-level registry
  could be transitively trusted if [=E4|verifiers=] do not enforce depth
  limits or independently validate each link during [=P6|Validate
  Credential(s)=]. Unbounded transitive trust chains amplify the blast radius
  of any single compromised registry: an attacker who compromises a registry
  at any depth gains the ability to assert recognition claims that propagate
  upward through the entire chain to [=E4|verifiers=] that have configured
  only a top-level trust anchor. Depth limits bound one chain. They do not
  bound how many chains a [=E4|verifier=] traverses, which
  [[[#list-retrieval-denial-of-service]]] covers.
elements: [O1, E1, E4, F5, P6]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Elevation of Privilege
response:
  - name: Chain Depth Limits and Per-Link Validation
    type: Reduce
    description: >-
      [=E4|Verifiers=] enforce a maximum depth limit, <code>maxDepth</code>,
      when traversing recognition chains via <code>recognizedIn</code>; the
      specification applies it in [=credential-based discovery=] and again in
      [=recognition validation=]. Each link in the chain is independently
      validated for cryptographic integrity and issuer trust during
      [=P6|Validate Credential(s)=] — transitive trust from a higher-level
      registry does not substitute for independent validation of each link.
      The ecosystem's governance authority, typically the operator of its
      trust anchor, specifies the maximum permitted chain depth and the
      registry types that can appear at each level in its governance
      framework, which is outside the specification. [=E4|Verifiers=] apply
      those rules as configuration and reject chains that exceed the
      configured depth or that include registry types the configuration does
      not permit.
    supportedBy:
      - '<a href="https://www.w3.org/TR/vc-recognized-entities-1.0/#credential-based-discovery">Section 4.1: Credential-based Discovery</a>'
      - '<a href="https://www.w3.org/TR/vc-recognized-entities-1.0/#recognition-validation">Section 4.3: Recognition Validation</a>'
    responsible: [verifiers, ecosystem governance]
    remainingRisk: >-
      The specification bounds chain depth only; which registries can appear
      at each level depends on ecosystem governance and verifier configuration.
