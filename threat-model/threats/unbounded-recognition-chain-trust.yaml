name: Unbounded Recognition Chain Trust
summary: >-
  A compromised entry in a lower-level registry chained via
  <code>recognizedIn</code> is transitively trusted when a [=verifier=] does
  not enforce depth limits or independently validate each link in the chain.
description: >-
  The <code>recognizedIn</code> property allows [=O1|recognized entity
  credentials=] to chain to other registries — such as ETSI Trust Service
  Lists, X.509 certificate authority lists, or other [=O1|recognized entity
  credentials=]. A compromised or malicious entry in a lower-level registry
  could be transitively trusted if [=E4|verifiers=] do not enforce depth
  limits or independently validate each link during [=P6|Validate
  Credential(s)=]. Unbounded transitive trust chains amplify the blast radius
  of any single compromised registry: an attacker who compromises a registry
  at any depth gains the ability to assert recognition claims that propagate
  upward through the entire chain to [=E4|verifiers=] that have configured
  only a top-level trust anchor. Depth limits and per-link validation check
  that each link is genuine; they do not check what each link was allowed to
  pass on. An intermediate that was recognized for one action can recognize
  another entity for a different action, and a [=E4|verifier=] that checks
  only the first two [=verifiable credentials=] in the chain will accept it.
elements: [O1, E1, E4, F5, P6]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Elevation of Privilege
response:
  - id: R12
    name: Chain Depth Limits and Per-Link Validation
    type: Reduce
    description: >-
      [=E4|Verifiers=] enforce a maximum depth limit when traversing
      recognition chains via <code>recognizedIn</code>. Each link in the chain
      is independently validated for cryptographic integrity and issuer trust
      during [=P6|Validate Credential(s)=] — transitive trust from a
      higher-level registry does not substitute for independent validation of
      each link. Ecosystem governance frameworks specify maximum permitted
      chain depths and enumerate the specific registry types that might appear
      at each level. [=E4|Verifiers=] reject chains that exceed the configured
      depth or that include registry types not explicitly permitted by their
      governance configuration. [=E4|Verifiers=] also check every
      intermediate in the chain, not only the credential that directly
      recognizes the [=E2|issuer=]. An intermediate is required to be allowed
      to perform the action for which it recognized another entity.
