name: Anti-Competitive List Gatekeeping
summary: >-
  A first-mover list publisher selectively denies registration to competitors,
  or is coerced into revoking legitimate entities, creating anti-competitive
  lock-in for [=verifiers=] that rely on a single list.
description: >-
  A first-mover that establishes the initial [=O1|recognized entity
  credential=] list for a market vertical — such as a national business
  register, an accreditation authority, or an industry consortium — can
  selectively deny registration to competitors or disfavored entities,
  creating a de facto monopoly or anti-competitive lock-in. [=E4|Verifiers=]
  that rely exclusively on a single [=O1|recognized entity credential=] list
  become entirely dependent on the [=E1|list publisher=]’s goodwill and
  business interests. Conversely, a [=E1|list publisher=] can also be coerced
  by governments or other powerful actors into revoking the recognition of
  legitimate entities, effectively censoring them from the ecosystem.
  The threat lies in the [=E1|list publisher=]'s admission and revocation
  policy ([=P1|Create List=], [=P7|Update List=]) and in a [=E4|verifier=]
  configured with a single trust anchor ([=P3|Configure Verifier=]). It is an
  External Threat because the specification cannot compel a [=E1|list
  publisher=] to recognize an entity, and a Denial of Service because the
  excluded [=E2|issuer=] is denied participation in the ecosystem.
elements: [E1, E2, E4, P1, P3, P7, F2, O1]
tags: [market competition]
taxonomyName: STRIDE
taxonomyClass: Denial of Service
response:
  - id: R5
    name: List Pluralism via Multi-Trust-Anchor Configuration
    type: Reduce
    description: >-
      The specification permits and encourages multiple overlapping and
      competing [=O1|recognized entity credential=] registries.
      [=E4|Verifiers=] are configurable with multiple independent trust
      anchors, so that an entity recognized by any one list from within the
      configured set is accepted. This prevents any single [=E1|list
      publisher=] from having veto power over ecosystem participation.
      Ecosystem designers actively encourage multiple independent [=E1|list
      publishers=] to publish [=O1|recognized entity credentials=] for the
      same market vertical, reducing systemic dependency on any single
      authority.
