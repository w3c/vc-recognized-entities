name: List Retrieval Denial of Service
summary: >-
  A flood of fetch requests, a slow-drip server, or an excessively large list
  exhausts a [=verifier=]'s connections, memory, or CPU when it retrieves and
  processes a [=recognized entity credential=].
description: >-
  When [=E4|verifiers=] fetch [=O1|recognized entity credential=] resources
  directly from external URLs, two classes of denial-of-service condition can
  arise. At the network layer, a surge of simultaneous verification requests
  can overwhelm the [=C1|publisher system=] list host, turning the
  [=O1|recognized entity credential=] list into a single point of failure;
  alternatively, a slow-drip server can return a response byte-by-byte,
  causing [=E4|verifier=] processes to hang indefinitely and exhaust
  connection pools. At the data layer, a [=O1|recognized entity credential=]
  whose list of recognized entities grows to an impractical size — either
  through legitimate growth or adversarial inflation — can exhaust memory or
  CPU when the [=E4|verifier=] naively loads, parses, or searches the entire
  list during [=P6|Validate Credential(s)=]. High-throughput verification
  systems (such as customs authorities processing thousands of trade documents
  per hour) are especially vulnerable to both classes of attack. A third class
  is cumulative. [=Identifier-based discovery=] traverses every candidate in a
  [=verifiable presentation=], and each traversal can retrieve a further chain
  of [=O1|recognized entity credentials=]. The [=E2|issuer=] controls how many
  candidates its presentation carries. Per-fetch limits do not bound the
  total, because every individual fetch can stay well inside them.
elements: [O1, E1, E3, E4, F5, P6, C1, C4, S1]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Denial of Service
response:
  - id: R3
    name: Credential Stapling, Caching, Timeouts, and Size Limits
    type: Reduce
    description: >-
      [=E3|Holders=] present [=O1|recognized entity credentials=] directly to
      [=E4|verifiers=] (“credential stapling”) rather than requiring
      [=E4|verifiers=] to fetch them, distributing load away from the list
      host. When direct fetching is necessary, [=E4|verifier=] implementations
      enforce both connection and read timeouts and enforce maximum payload
      size limits on all list fetches. [=E4|Verifiers=] impose maximum list
      size thresholds and reject or skip lists that exceed configurable
      limits. Implementations use streaming or paginated access patterns
      rather than loading entire lists into memory. [=E4|Verifiers=] cache
      resolved [=O1|recognized entity credentials=] with appropriate TTLs
      aligned to the credential’s <code>validUntil</code> period. [=E1|List
      publishers=] deploy content delivery network infrastructure, rate
      limiting, and paginated or indexed lookup mechanisms to allow
      [=E4|verifiers=] to check membership without retrieving full lists.
      Per-fetch limits do not bound a whole discovery operation.
      [=E4|Verifiers=] also impose a time budget covering the entire
      operation, including every nested traversal, and fail the operation when
      it is exceeded. A [=E4|verifier=] that fails this way has established
      nothing about the [=E2|issuer=], and the residual risk is that a
      [=E2|issuer=] can deny verification of its own credentials by publishing
      a presentation too large to traverse in time.
