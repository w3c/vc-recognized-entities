name: External Resource Substitution
summary: >-
  An attacker substitutes malicious content for an externally-referenced
  resource, such as a schema file, via server compromise, domain takeover, or
  DNS hijacking when the reference is not integrity-protected.
description: >-
  A [=O1|recognized entity credential=] may reference external resources —
  such as <code>outputValidation</code> schema files or governance documents
  — via URL. If those URLs are not integrity-protected, an attacker can
  substitute malicious content through any of three mechanisms: (1)
  compromising the hosting server directly and altering the files in
  [=S1|publisher storage=]; (2) acquiring or hijacking the domain the URL
  resolves to (e.g., via domain expiry or sale), allowing the new controller
  to replace previously trusted content; or (3) poisoning the DNS cache used
  by the [=E4|verifier=] during [=F5|Retrieve List=], redirecting resolution
  to an attacker-controlled server without the domain changing hands. In all
  three cases, [=E4|verifiers=] running [=P6|Validate Credential(s)=] who
  fetch and apply the substituted resource may accept [=O2|dependent
  verifiable credentials=] that fall outside the intended schema, or reject
  valid ones, without any indication that the external resource has been
  tampered with.
elements: [O1, E1, E4, F5, P6, C1, S1]
tags: [security]
taxonomyName: STRIDE
taxonomyClass: Tampering
response:
  - id: R11
    name: Content Integrity Protection, DNSSEC, and TLS Verification
    type: Reduce
    description: >-
      [=E1|List publishers=] protect externally-referenced resources in
      [=O1|recognized entity credentials=] with a content digest, such as
      <code>digestMultibase</code>. A digest catches substitution however it
      happened. It is the primary defense against all three mechanisms.
      [=E4|Verifiers=] check a fetched resource against its declared digest
      before applying it during [=P6|Validate Credential(s)=]. A mismatch is
      a hard failure. [=E4|Verifiers=] use DNSSEC-validating resolvers. They
      check TLS certificates against expected values. Where possible, schema
      files are embedded in the credential, or hosted within the
      [=C1|publisher system=]. The specification does not require a digest. A
      [=O1|recognized entity credential=] can reference an external resource
      without one, and then a [=E4|verifier=] has nothing to check against.
      Ecosystem governance, not the specification, decides whether to reject
      such credentials. Without that policy, a [=E4|verifier=] that fetches
      an unprotected resource stays exposed.
