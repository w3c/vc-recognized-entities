<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" style="width:100%"
     font-family="Inter, Helvetica, Arial, sans-serif" role="img"
     aria-labelledby="cev-t cev-d">
    <title id="cev-t">A market surveillance authority verifying a battery's digital product passport</title>
    <desc id="cev-d">The authority scans the battery and receives its product passport
        with the recognition chain stapled to it. Without network access it walks the
        chain upwards: at each hop it finds the stapled credential whose subject is the
        current issuer's DID and follows its recognizedBy, until it reaches a DID on its
        own list of configured roots. Two branches close — notification at the European
        Commission and accreditation at the IAF — after which it checks that the
        notified body's recognition scope actually covers the Battery Regulation.</desc>

    <style>
        :root { --text: #000; }
        @media (prefers-color-scheme: dark) { :root { --text: #ddd; } }
        .cev-rot   { fill:#0b5288; stroke:#0f766e; }
        .cev-actor { fill:#e8eaf8; stroke:#0f766e; }
        .cev-prod  { fill:#ffffff; stroke:#0f766e; }
        .cev-msa   { fill:#1f2937; stroke:#0f766e; }
        .cev-box   { stroke-width:1.5; rx:6; }
        .cev-lw    { fill:#ffffff; font-size:13px; font-weight:600; }
        .cev-ld    { fill:#111111; font-size:13px; font-weight:600; }
        .cev-sub   { font-size:10.5px; font-weight:400; opacity:.8; }
        .cev-ray   { stroke:#c8ced2; stroke-width:1.5; fill:none; }
        .cev-qry   { stroke:#be5809; stroke-width:1.8; stroke-dasharray:5 4; fill:none; }
        .cev-dot   { fill:#fbbf24; stroke:#be5809; stroke-width:1.5; }
        .cev-qt    { fill:#be5809; font-size:10px; font-weight:600; text-anchor:middle; }
        .cev-ok    { fill:#15803d; stroke:#ffffff; stroke-width:1.5; }
        .cev-okm   { stroke:#ffffff; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
        .cev-root  { fill:none; stroke:#a36907; stroke-width:2.5; rx:9; }
        .cev-roott { fill:#be5809; font-size:9.5px; font-weight:700; text-anchor:middle; letter-spacing:.4px; }
        .cev-step  { fill:var(--text, #000); font-size:13px; }
        .cev-stepn { fill:#be5809; font-size:13px; font-weight:700; }
        .cev-cap   { fill:var(--text, #000); font-size:11.5px; }
        .cev-hd    { fill:var(--text, #000); font-size:16px; font-weight:700; }
        .cev-pill  { fill:#ecfdf5; stroke:#15803d; stroke-width:1.5; rx:11; }
        .cev-pillt { fill:#15803d; font-size:11px; font-weight:600; }
    </style>

    <defs>
        <marker id="cev-qa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="#be5809"/>
        </marker>

        <!-- verification rays: the issuance arrows of CE-marking-flow.svg, reversed -->
        <path id="cev-v1" class="cev-qry" marker-end="url(#cev-qa)" d="M1030 540 L968 540"/>
        <path id="cev-v2" class="cev-qry" marker-end="url(#cev-qa)" d="M778 540  L728 540"/>
        <path id="cev-v3" class="cev-qry" marker-end="url(#cev-qa)" d="M540 540  L205 540"/>
        <path id="cev-v4" class="cev-qry" marker-end="url(#cev-qa)" d="M694 516  L866 326"/>
        <path id="cev-v5" class="cev-qry" marker-end="url(#cev-qa)" d="M812 288  L462 92"/>
        <path id="cev-v6" class="cev-qry" marker-end="url(#cev-qa)" d="M808 300  L722 300"/>
        <path id="cev-v7" class="cev-qry" marker-end="url(#cev-qa)" d="M280 90   L202 90"/>
        <path id="cev-v8" class="cev-qry" marker-end="url(#cev-qa)" d="M540 300  L462 300"/>
        <path id="cev-v9" class="cev-qry" marker-end="url(#cev-qa)" d="M280 300  L202 300"/>

        <g id="cev-tick">
            <circle class="cev-ok" r="10"/>
            <path class="cev-okm" d="M-4.5 0 L-1 3.5 L4.5 -3.5"/>
        </g>
    </defs>

    <text class="cev-hd" x="40" y="42">Market surveillance authority verifies Battery #123</text>
    <text class="cev-cap" x="40" y="64">Offline, from a stapled presentation — match each issuer DID to a credential subject, follow recognizedBy until a configured root is reached. 20 s loop.</text>

    <!-- everything below the title is shifted down so the "configured root"
         rings and their captions clear the subtitle -->
    <g transform="translate(0,68)">

        <g stroke-linecap="round">
            <use href="#cev-v1"/><use href="#cev-v2"/><use href="#cev-v3"/><use href="#cev-v4"/><use href="#cev-v5"/>
            <use href="#cev-v6"/><use href="#cev-v7"/><use href="#cev-v8"/><use href="#cev-v9"/>
        </g>

        <!-- ─── entities ─────────────────────────────────────────────────────── -->
        <g class="cev-box">
            <rect class="cev-rot"   x="20"   y="65"  width="180" height="50"/>
            <rect class="cev-rot"   x="280"  y="65"  width="180" height="50"/>
            <rect class="cev-rot"   x="20"   y="275" width="180" height="50"/>
            <rect class="cev-rot"   x="280"  y="275" width="180" height="50"/>
            <rect class="cev-rot"   x="540"  y="275" width="180" height="50"/>
            <rect class="cev-actor" x="810"  y="275" width="180" height="50"/>
            <rect class="cev-rot"   x="20"   y="515" width="180" height="50"/>
            <rect class="cev-actor" x="540"  y="515" width="180" height="50"/>
            <rect class="cev-prod"  x="780"  y="515" width="180" height="50"/>
            <rect class="cev-msa"   x="1030" y="515" width="180" height="50"/>
        </g>

        <!-- the three roots the authority has configured -->
        <g>
            <rect class="cev-root" x="14" y="59"  width="192" height="62"/>
            <rect class="cev-root" x="14" y="269" width="192" height="62"/>
            <rect class="cev-root" x="14" y="509" width="192" height="62"/>
            <text class="cev-roott" x="110" y="52">CONFIGURED ROOT</text>
            <text class="cev-roott" x="110" y="262">CONFIGURED ROOT</text>
            <text class="cev-roott" x="110" y="502">CONFIGURED ROOT</text>
        </g>

        <g text-anchor="middle">
            <text class="cev-lw" x="110"  y="86">European Commission<tspan class="cev-sub" x="110" dy="17">did:web:ec.europa.example</tspan></text>
            <text class="cev-lw" x="370"  y="86">National Notifying Authority<tspan class="cev-sub" x="370" dy="17">e.g. BMWK</tspan></text>
            <text class="cev-lw" x="110"  y="296">IAF<tspan class="cev-sub" x="110" dy="17">did:web:iaf.example</tspan></text>
            <text class="cev-lw" x="370"  y="296">European Accreditation<tspan class="cev-sub" x="370" dy="17">EA</tspan></text>
            <text class="cev-lw" x="630"  y="296">Accreditation body<tspan class="cev-sub" x="630" dy="17">e.g. DAkkS</tspan></text>
            <text class="cev-ld" x="900"  y="296">Conformity assessment<tspan class="cev-sub" x="900" dy="17">TÜV — notified body 0123</tspan></text>
            <text class="cev-lw" x="110"  y="536">Business register<tspan class="cev-sub" x="110" dy="17">did:web:handelsregister.example</tspan></text>
            <text class="cev-ld" x="630"  y="536">Manufacturer<tspan class="cev-sub" x="630" dy="17">AlphaCell Batteries GmbH</tspan></text>
            <text class="cev-ld" x="870"  y="536">Battery #123<tspan class="cev-sub" x="870" dy="17">physical product</tspan></text>
            <text class="cev-lw" x="1120" y="536">Market surveillance<tspan class="cev-sub" x="1120" dy="17">authority — verifier</tspan></text>
        </g>

        <!-- ─── the query walking the chain ──────────────────────────────────────
             20 s loop. Each hop: wait, travel, vanish. Fractions of the loop:
               every hop is resolved inside the stapled presentation, offline
               v1  0.5→2.5   scan, receive passport + stapled chain
               v2  2.5→4.5   passport issuer: AlphaCell
               v3  5.0→7.0   recognizedBy → business register      (root reached)
               v4  5.0→7.0   follow C_DOC → C_CC to the notified body
               v5  7.5→9.5   recognizedBy → notifying authority
               v6  7.5→9.5   recognizedBy → accreditation body
               v7 10.0→12.0  recognizedBy → European Commission    (root reached)
               v8 10.0→12.0  recognizedBy → European Accreditation
               v9 12.5→14.5  recognizedBy → IAF                    (root reached)
        ──────────────────────────────────────────────────────────────────────── -->
        <g class="mover">
            <g opacity="1">
                <circle class="cev-dot" r="11"/><text class="cev-qt" y="-18">scan</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.025;0.125"/>
                <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear"
                               keyPoints="0;0;1;1" keyTimes="0;0.025;0.125;1"><mpath href="#cev-v1"/></animateMotion>
            </g>
            <g opacity="1">
                <circle class="cev-dot" r="11"/><text class="cev-qt" y="-18">C_DPP + stapled chain</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.125;0.225"/>
                <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear"
                               keyPoints="0;0;1;1" keyTimes="0;0.125;0.225;1"><mpath href="#cev-v2"/></animateMotion>
            </g>

            <g opacity="1">
                <circle class="cev-dot" r="11"/><text class="cev-qt" y="-18">recognizedBy</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.25;0.35"/>
                <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear"
                               keyPoints="0;0;1;1" keyTimes="0;0.25;0.35;1"><mpath href="#cev-v3"/></animateMotion>
            </g>
            <g opacity="1">
                <circle class="cev-dot" r="11"/><text class="cev-qt" y="-18">C_DOC → C_CC</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.25;0.35"/>
                <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear"
                               keyPoints="0;0;1;1" keyTimes="0;0.25;0.35;1"><mpath href="#cev-v4"/></animateMotion>
            </g>

            <g opacity="1">
                <circle class="cev-dot" r="11"/><text class="cev-qt" y="-18">recognizedBy</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.375;0.475"/>
                <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear"
                               keyPoints="0;0;1;1" keyTimes="0;0.375;0.475;1"><mpath href="#cev-v5"/></animateMotion>
            </g>
            <g opacity="1">
                <circle class="cev-dot" r="11"/><text class="cev-qt" y="-18">recognizedBy</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.375;0.475"/>
                <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear"
                               keyPoints="0;0;1;1" keyTimes="0;0.375;0.475;1"><mpath href="#cev-v6"/></animateMotion>
            </g>

            <g opacity="1">
                <circle class="cev-dot" r="11"/><text class="cev-qt" y="-18">recognizedBy</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.5;0.6"/>
                <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear"
                               keyPoints="0;0;1;1" keyTimes="0;0.5;0.6;1"><mpath href="#cev-v7"/></animateMotion>
            </g>
            <g opacity="1">
                <circle class="cev-dot" r="11"/><text class="cev-qt" y="-18">recognizedBy</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.5;0.6"/>
                <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear"
                               keyPoints="0;0;1;1" keyTimes="0;0.5;0.6;1"><mpath href="#cev-v8"/></animateMotion>
            </g>

            <g opacity="1">
                <circle class="cev-dot" r="11"/><text class="cev-qt" y="-18">recognizedBy</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.625;0.725"/>
                <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear"
                               keyPoints="0;0;1;1" keyTimes="0;0.625;0.725;1"><mpath href="#cev-v9"/></animateMotion>
            </g>
        </g>

        <!-- ─── checks, appearing as each hop lands and staying on ───────────── -->
        <g>
            <g class="timed" opacity="1" transform="translate(944,512)"><use href="#cev-tick"/>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.125;0.98"/></g>
            <g class="timed" opacity="1" transform="translate(704,512)"><use href="#cev-tick"/>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.225;0.98"/></g>
            <g class="timed" opacity="1" transform="translate(184,512)"><use href="#cev-tick"/>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.35;0.98"/></g>
            <g class="timed" opacity="1" transform="translate(974,272)"><use href="#cev-tick"/>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.35;0.98"/></g>
            <g class="timed" opacity="1" transform="translate(444,62)"><use href="#cev-tick"/>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.475;0.98"/></g>
            <g class="timed" opacity="1" transform="translate(704,272)"><use href="#cev-tick"/>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.475;0.98"/></g>
            <g class="timed" opacity="1" transform="translate(184,62)"><use href="#cev-tick"/>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.6;0.98"/></g>
            <g class="timed" opacity="1" transform="translate(444,272)"><use href="#cev-tick"/>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.6;0.98"/></g>
            <g class="timed" opacity="1" transform="translate(184,272)"><use href="#cev-tick"/>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                         values="1;0;1;0" keyTimes="0;0.001;0.725;0.98"/></g>
        </g>

        <!-- scope check: the part §4.1 does not specify -->
        <g class="timed" opacity="1" transform="translate(760,222)">
            <rect class="cev-pill" x="0" y="-16" width="280" height="26"/>
            <text class="cev-pillt" x="12" y="2">scope ✓ Reg. (EU) 2023/1542 · Module D1</text>
            <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                     values="1;0;1;0" keyTimes="0;0.001;0.75;0.98"/>
        </g>

        <!-- ─── running commentary ───────────────────────────────────────────── -->
        <g transform="translate(40,610)">
            <g class="timed" opacity="0"><text class="cev-stepn" x="0" y="0">1</text><text class="cev-step" x="18" y="0">Scan the battery. Its Digital Product Passport arrives with the whole recognition chain stapled to it — no network needed from here on.</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.025;0.225"/></g>
            <g class="timed" opacity="0"><text class="cev-stepn" x="0" y="0">2</text><text class="cev-step" x="18" y="0">The passport's issuer, AlphaCell, is unknown — find the stapled credential whose subject is its DID and follow recognizedBy.</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.225;0.375"/></g>
            <g class="timed" opacity="0"><text class="cev-stepn" x="0" y="0">3</text><text class="cev-step" x="18" y="0">Business register reached — a configured root. In parallel, the passport's conformity claim leads to the certificate issued by TÜV.</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.375;0.5"/></g>
            <g class="timed" opacity="0"><text class="cev-stepn" x="0" y="0">4</text><text class="cev-step" x="18" y="0">TÜV is unknown too: two stapled credentials name its DID, recognized by the notifying authority and the accreditation body. The chain branches.</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.625"/></g>
            <g class="timed" opacity="1"><text class="cev-stepn" x="0" y="0">5</text><text class="cev-step" x="18" y="0">Both branches close at configured root DIDs: European Commission on notification, IAF on accreditation. Every hop's proof and validity period checked.</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" values="1;0;1;0" keyTimes="0;0.001;0.625;0.75"/></g>
            <g class="timed" opacity="1"><text class="cev-stepn" x="0" y="0">6</text><text class="cev-step" x="18" y="0">Last: does TÜV's recognition scope actually cover this regulation and module? It does. Passport accepted.</text>
                <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" values="1;0;1;0" keyTimes="0;0.001;0.75;0.98"/></g>
        </g>

        <g transform="translate(40,640)">
            <circle class="cev-dot" cx="8" cy="-4" r="8"/>
            <text class="cev-cap" x="26" y="0">lookup inside the stapled presentation · a green tick marks a hop whose proof and validity period verified offline · gold marks the authority's own recognition anchors</text>
        </g>


    </g>
</svg>
